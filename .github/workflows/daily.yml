name: Daily forecast

on:
  schedule:
    - cron: "30 13 * * *"      # ~06:30 Pacific (13:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build daily score grids
        run: python scripts/daily_update.py
      - name: Show payload
        run: ls -la site/data && du -sh site
      - name: Keep the generated site as an artifact (debugging / manual download)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
      # Deploy to Cloudflare as a Worker with static assets (wrangler.toml), by direct upload - works from a
      # private repo. Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Deploy skipped
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set - built site kept as artifact only (see README)."
