name: Daily forecast

on:
  schedule:
    - cron: "30 13 * * *"      # ~06:30 Pacific (13:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build daily score grids
        run: python scripts/daily_update.py
      - name: Show payload
        run: ls -la site/data && du -sh site
      - name: Keep the generated site as an artifact (debugging / manual download)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
      # Deploy to Cloudflare Pages by direct upload (works from a private repo, no Git integration needed).
      # Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
      # and a Pages project named `mushroom-map` (see README).
      - name: Create Cloudflare Pages project if missing
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -s -o /tmp/proj.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/mushroom-map")
          if [ "$code" = "200" ]; then echo "project exists"; exit 0; fi
          echo "project lookup returned HTTP $code:"; cat /tmp/proj.json; echo
          echo "creating project mushroom-map"
          curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"mushroom-map","production_branch":"main"}' "$api" | head -c 400; echo
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=mushroom-map --branch=main --commit-dirty=true
      - name: Deploy skipped
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set - built site kept as artifact only (see README)."
